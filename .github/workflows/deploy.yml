name: Deploy to Raspberry Pi

on:
  push:
    branches: [master, main]
  workflow_dispatch:

# GHCR image names must be lowercase (owner "MykolaKolbun" → "mykolakolbun").
env:
  IMAGE: ghcr.io/mykolakolbun/parkingsubscription-api

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore, build, test
        working-directory: backend
        run: |
          dotnet test -c Release

  build-and-deploy:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU (for arm64 cross-build)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API image (linux/arm64)
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/ParkingSubscription.Api/Dockerfile
          push: true
          platforms: linux/arm64
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Copy deploy files to the Pi
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.PI_HOST }}
          username: ${{ secrets.PI_USER }}
          key: ${{ secrets.PI_SSH_PRIVATE_KEY }}
          port: ${{ secrets.PI_PORT || '22' }}
          source: "deploy/docker-compose.yml,deploy/init.sql,deploy/nginx-apk.conf"
          target: "~/projects/subscribeapp"
          strip_components: 1

      - name: Deploy on the Pi
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.PI_HOST }}
          username: ${{ secrets.PI_USER }}
          key: ${{ secrets.PI_SSH_PRIVATE_KEY }}
          port: ${{ secrets.PI_PORT || '22' }}
          script: |
            set -e
            cd ~/projects/subscribeapp
            mkdir -p apk

            # Write .env from secrets (kept out of shell history).
            cat > .env <<'SECRETS'
            DB_NAME=SWeb_DB
            DB_USER=parking
            DB_PASSWORD=${{ secrets.DB_PASSWORD }}
            JWT_SIGNING_KEY=${{ secrets.JWT_SIGNING_KEY }}
            API_IMAGE=ghcr.io/mykolakolbun/parkingsubscription-api:latest
            SECRETS

            # The Pi is expected to already be logged in to GHCR (one-time
            # `docker login ghcr.io` during setup), so the private image pulls
            # automatically — same as the EVCharging deployment.
            docker compose pull
            docker compose up -d --remove-orphans

            # Wait for the API health endpoint.
            for i in $(seq 1 20); do
              if curl -fsS http://localhost:8081/health >/dev/null; then echo "API healthy"; exit 0; fi
              sleep 5
            done
            echo "API did not become healthy" >&2
            docker compose logs --tail=50 api
            exit 1
