name: Build and Deploy

on:
  push:
    branches: [main, master]
  workflow_dispatch:

# Cancel any in-progress deploy for the same branch when a new push arrives
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push ARM64 API image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/ParkingSubscription.Api/Dockerfile
          platforms: linux/arm64
          push: true
          tags: ghcr.io/mykolakolbun/parkingsubscription-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push ARM64 Admin Panel image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/ParkingSubscription.AdminPanel/Dockerfile
          platforms: linux/arm64
          push: true
          tags: ghcr.io/mykolakolbun/parkingsubscription-admin:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install cloudflared
        run: |
          curl -L https://pkg.cloudflare.com/cloudflare-main.gpg | sudo tee /usr/share/keyrings/cloudflare-main.gpg >/dev/null
          echo 'deb [signed-by=/usr/share/keyrings/cloudflare-main.gpg] https://pkg.cloudflare.com/cloudflared any main' | sudo tee /etc/apt/sources.list.d/cloudflared.list
          sudo apt update && sudo apt install cloudflared -y

      - name: Deploy to Raspberry Pi
        env:
          DB_PASSWORD:     ${{ secrets.DB_PASSWORD }}
          JWT_SIGNING_KEY: ${{ secrets.JWT_SIGNING_KEY }}
          IPAY_MCH_ID:     ${{ secrets.IPAY_MCH_ID }}
          IPAY_SIGN_KEY:   ${{ secrets.IPAY_SIGN_KEY }}
          IPAY_BASE_URL:   ${{ secrets.IPAY_BASE_URL }}
          CHECKBOX_PIN:         ${{ secrets.CHECKBOX_PIN }}
          CHECKBOX_LICENSE_KEY: ${{ secrets.CHECKBOX_LICENSE_KEY }}
          CHECKBOX_BASE_URL:    ${{ secrets.CHECKBOX_BASE_URL }}
          CHECKBOX_TAX_CODE:    ${{ secrets.CHECKBOX_TAX_CODE }}
          ADMIN_PASSWORD:       ${{ secrets.ADMIN_PASSWORD }}
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.PI_SSH_PRIVATE_KEY }}" | base64 -d > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          cat >> ~/.ssh/config << EOF
          Host ${{ secrets.PI_HOST }}
            ProxyCommand cloudflared access ssh --hostname %h
            StrictHostKeyChecking no
          EOF

          PI="${{ secrets.PI_USER }}@${{ secrets.PI_HOST }}"

          # Ensure the app + APK folders exist on the Pi.
          ssh "$PI" "mkdir -p ~/SilverBreezeSubscriberApp/apk"

          # Copy the compose stack + supporting files.
          scp -F ~/.ssh/config deploy/docker-compose.yml "$PI":~/SilverBreezeSubscriberApp/docker-compose.yml
          scp -F ~/.ssh/config deploy/init.sql          "$PI":~/SilverBreezeSubscriberApp/init.sql
          scp -F ~/.ssh/config deploy/nginx-apk.conf    "$PI":~/SilverBreezeSubscriberApp/nginx-apk.conf

          # Upsert only the required secrets into .env on the Pi; other vars preserved.
          # Secrets flow: GitHub Secrets -> env: block -> printf (local) -> stdin -> Pi (never in argv).
          # iPay vars are written only when set, so an unset secret never clobbers the .env.
          {
            printf 'DB_PASSWORD=%s\n' "$DB_PASSWORD"
            printf 'JWT_SIGNING_KEY=%s\n' "$JWT_SIGNING_KEY"
            [ -n "$IPAY_MCH_ID" ]   && printf 'IPAY_MCH_ID=%s\n' "$IPAY_MCH_ID"
            [ -n "$IPAY_SIGN_KEY" ] && printf 'IPAY_SIGN_KEY=%s\n' "$IPAY_SIGN_KEY"
            [ -n "$IPAY_BASE_URL" ] && printf 'IPAY_BASE_URL=%s\n' "$IPAY_BASE_URL"
            [ -n "$CHECKBOX_PIN" ]         && printf 'CHECKBOX_PIN=%s\n' "$CHECKBOX_PIN"
            [ -n "$CHECKBOX_LICENSE_KEY" ] && printf 'CHECKBOX_LICENSE_KEY=%s\n' "$CHECKBOX_LICENSE_KEY"
            [ -n "$CHECKBOX_BASE_URL" ]    && printf 'CHECKBOX_BASE_URL=%s\n' "$CHECKBOX_BASE_URL"
            [ -n "$CHECKBOX_TAX_CODE" ]    && printf 'CHECKBOX_TAX_CODE=%s\n' "$CHECKBOX_TAX_CODE"
            [ -n "$ADMIN_PASSWORD" ]       && printf 'ADMIN_PASSWORD=%s\n' "$ADMIN_PASSWORD"
          } | \
            ssh "$PI" '
              touch ~/SilverBreezeSubscriberApp/.env
              while IFS= read -r line; do
                key="${line%%=*}"
                sed -i "/^${key}=/d" ~/SilverBreezeSubscriberApp/.env 2>/dev/null || true
                echo "$line" >> ~/SilverBreezeSubscriberApp/.env
              done
            '

          # Pull the freshly built image and (re)start the stack.
          ssh "$PI" "
            cd ~/SilverBreezeSubscriberApp &&
            docker compose pull &&
            docker compose down --remove-orphans --timeout 30 || true &&
            docker compose up -d
          "
