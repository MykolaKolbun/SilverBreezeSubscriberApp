            $ref: '#/components/schemas/GetValueCard'

    GetValueCard:
      allOf:
        - $ref: "#/components/schemas/ManageDoorAccess"
        - $ref: "#/components/schemas/ValueCard"
        - type: object
          required:
            - userId
