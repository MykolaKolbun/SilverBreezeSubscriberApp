        startDate:
          type: string
          format: date
          description: Must be between valid from and valid to of the parking card
        endDate:
          type: string
          format: date
          description: Must be between valid from and valid to of the parking card and after the start date of the suspension

    CreateValueCard:
      allOf:
        - $ref: "#/components/schemas/ManageIdentification"
        - $ref: "#/components/schemas/ValueCard"
        - type: object
          required:
