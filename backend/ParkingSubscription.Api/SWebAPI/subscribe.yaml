            - productId
            - lastUpdated
            - transferStatus
            - productionReason
          properties:
            userId:
              type: string
              format: uuid
            valueCardId:
              type: string
              format: uuid
              description: Value Card ID. Returned at creation of a Value Card and to be used by get, update, delete.
            productId:
              type: string
              format: uuid
            productName:
              type: string
              maxLength: 512
              nullable: true
            lastUpdated:
              type: string
              format: date-time
            blockDate:
              type: string
              format: date
              nullable: true
            suspension:
              $ref: "#/components/schemas/Suspension"
            transferStatus:
              $ref: "#/components/schemas/TransferStatus"
            productionReason:
              $ref: "#/components/schemas/ProductionReason"
            anonymized:
              type: boolean
              description: Boolean flag that the value card was marked as anonymized and overwritten with random values.
              example: false
            canceled:
              type: boolean
              description: Boolean flag that the value card was canceled.
              example: false

    GetValueCards:
      type: array
      items:
        $ref: "#/components/schemas/GetValueCard"

    UpdateValueCard:
      allOf:
        - $ref: "#/components/schemas/ManageIdentification"
        - $ref: "#/components/schemas/ValueCard"

    BlockValueCard:
      type: object
      required:
        - startDate
      properties:
        startDate:
          type: string
          format: date
          description: when does block start

    SuspendValueCard:
      type: object
      required:
        - startDate
        - endDate
      properties:
        startDate:
          type: string
          format: date
          description: Must be between valid from and valid to of the value card
        endDate:
          type: string
          format: date
