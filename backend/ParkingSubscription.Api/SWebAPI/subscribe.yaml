components:
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
  schemas:
    CreateCustomer:
      allOf:
        - $ref: "#/components/schemas/Customer"

    GetCustomer:
      allOf:
        - $ref: "#/components/schemas/Customer"
        - type: object
          required:
            - customerId
            - lastUpdated
          properties:
            customerId:
              type: string
              format: uuid
            lastUpdated:
              type: string
              format: date-time
            blockDate:
              type: string
              format: date
              nullable: true
              description: This specifies the date when the customer, including all their associated users/cards, will be blocked. This means they will no longer be authorized to enter or exit the facility.
              example: "2020-05-01"
            expireDate:
              type: string
              format: date
              nullable: true
              description: This specifies the date when the customer contact will expire. This date will be set when an anonymizeCustomer is done but the customer contact still has valid contracts and subscriptions. After the expire date, no valid subscriptions etc. will exist and the customer contact will get anonymized automatically and can then not be fetched anymore by getCustomer.
              example: "2020-05-01"
            anonymized:
              type: boolean
              description: Boolean flag that the customer was marked as anonymized and overwritten with random values.
              example: false
            deleted:
              type: boolean
              description: Boolean flag that the customer was marked as deleted.
              example: false

    GetPagedCustomers:
      type: object
      properties:
        nextPagingToken:
          type: string
          description: Token to be used for next request to fetch next page. If the token is null, no furhter changes are available.
        customers:
          type: array
          items:
            $ref: '#/components/schemas/GetCustomer'

    GetCustomers:
      type: array
      items:
        $ref: "#/components/schemas/GetCustomer"

    UpdateCustomer:
      allOf:
        - $ref: "#/components/schemas/Customer"

    BlockCustomer:
      type: object
      required:
        - startDate
      properties:
        startDate:
          type: string
          format: date
          description: when does block start

    CreateUser:
      allOf:
        - $ref: "#/components/schemas/User"

    GetPagedUsers:
      type: object
      properties:
        nextPagingToken:
          type: string
          description: Token to be used for next request to fetch next page. If the token is null, no furhter changes are available.
        users:
          type: array
          items:
            $ref: '#/components/schemas/GetUser'

    GetUser:
      allOf:
        - $ref: "#/components/schemas/User"
        - type: object
          required:
            - userId
            - lastUpdated
          properties:
            userId:
              type: string
              format: uuid
            lastUpdated:
              type: string
              format: date-time
            blockDate:
              type: string
              format: date
              nullable: true
              description: This specifies the date when the user, including all their associated cards, will be blocked. This means they will no longer be authorized to enter or exit the facility.
              example: "2020-05-01"
            suspension:
              $ref: "#/components/schemas/Suspension"
            expireDate:
              type: string
              format: date
              nullable: true
              description: This specifies the date when the user contact will expire. This date will be set when an anonymizeUser is done but the user contact still has valid subscriptions. After the expire date, no valid subscriptions etc. will exist and the user contact will get anonymized automatically and can then not be fetched anymore by getUser.
              example: "2020-05-01"
            anonymized:
              type: boolean
              description: Boolean flag that the user was marked as anonymized and overwritten with random values.
              example: false
            deleted:
              type: boolean
              description: Boolean flag that the user was marked as deleted.
              example: false

    GetUsers:
      type: array
      items:
        $ref: "#/components/schemas/GetUser"

    UpdateUser:
      allOf:
        - $ref: "#/components/schemas/User"

    BlockUser:
      type: object
      required:
        - startDate
      properties:
        startDate:
          type: string
          format: date
          description: when does block start

    SuspendUser:
      type: object
      required:
        - startDate
        - endDate
      properties:
        startDate:
          type: string
          format: date
          description: when does suspend start
        endDate:
          type: string
          format: date
          description: when does suspend end

    CreateParkingCard:
      allOf:
