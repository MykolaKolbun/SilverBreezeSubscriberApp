    Customer:
      allOf:
        - $ref: "#/components/schemas/Contact"
        - type: object
          properties:
            #Hostcomm Mapped
            parkingContract:
              $ref:  "#/components/schemas/CustomerParkingContract"
            #Hostcomm Mapped ends
            contactType:
              $ref:  "#/components/schemas/ContactType"

    Contact:
      allOf:
        - $ref: "#/components/schemas/Details"
        - type: object
          properties:
            #UI Mapped
            externalContactId:
              type: string
              maxLength: 32
              nullable: true
              description: an external ID of the contact
            website:
              type: string
              maxLength: 64
              nullable: true
              description: what is the users website
              example: nowhere.gov
            address:
              $ref:  "#/components/schemas/Address"
            communication:
              $ref:  "#/components/schemas/Communication"
            photo:
              $ref:  "#/components/schemas/Photo"
            department:
              $ref:  "#/components/schemas/Department"
            taxNumber:
              type: string
              description: Lets you enter the tax reference number.
              maxLength: 16
              nullable: true

    CustomerParkingContract:
      allOf:
        - $ref:  "#/components/schemas/UserParkingContract"
        - type: object
          properties:
            agreementNo:
              type: string
              maxLength: 20
              nullable: true
              description: This is a unique number assigned to the customer for identification purposes. You may enter any combination of numbers and letters and if nothin entered it will be automatically generated by the system
            accountingNo:
              type: string
              maxLength: 20
              nullable: true
              description: Lets you enter the accounting number.
            startDate:
              type: string
              format: date
              nullable: true
              description: This time specifies when the contract comes into effect. if not set will be today.
              example: "2020-05-01"
            endDate:
              type: string
              format: date
              nullable: true
              description: The end date must be later than or equal to the start date.
              example: "2020-05-01"
            defaultRemarks:
              $ref:  "#/components/schemas/Remarks"
            countNeutralCards:
              type: boolean
              description: If true, neutral cards will be included in the count.
            maxLevel:
              type: integer
              nullable: true
              description: Specifies the maximum number of contract parkers of the associated customer that may be present at the parking facility at the same time. Once this maximum level is reached, any further contract parkers of this user will be denied entry.
              maximum: 9999
            enterOverMax:
              type: boolean
              description: This will allow the contract parker to enter even if the maximum level has already been reached.

    Details:
      type: object
      required:
        - surname
      properties:
        surname:
          type: string
          maxLength: 64
          description: Surname to store on contact
          example: Williamson
        additionalSurname:
          type: string
          maxLength: 64
          nullable: true
          description: the additional surname may be used e.g. for japanese culture where names in a second language are possible
          example: Waters
        firstname:
          type: string
          maxLength: 64
          nullable: true
          description: Firstname to store on contact
          example: Louvenia
        additionalFirstname:
          type: string
          maxLength: 64
          nullable: true
          description: the additional firstname may be used e.g. for japanese culture where names in a second language are possible
          example: Hillary
        middlename:
          type: string
          maxLength: 64
          nullable: true
          description: Middlename to store on contact
          example: Emelia
        title:
          type: string
          maxLength: 32
          nullable: true
          description: title to store on the contact
          example: Mr
        abbreviation:
          type: string
          nullable: true
          description: The contact's short name
          maxLength: 32
          example: Emi
        salutation:
          type: string
          description: the conatct's salutation
          maxLength: 32
          nullable: true
          example: Dear
        telephone:
          type: string
          maxLength: 64
          nullable: true
          description: Telephone to store on contact
          example: 391-371-0986
        mobile:
          type: string
          maxLength: 64
          nullable: true
          description: Mobile number to store on contact
          example: 391-371-0986
        fax:
          type: string
          maxLength: 64
          nullable: true
          description: Fax to store on contact
          example: 391-371-0986
        email:
          type: string
          maxLength: 64
          nullable: true
          description: Email to store on contact
          example: john.doe@nowhere.gov
        dateOfBirth:
          type: string
          format: date
          nullable: true
          description: The contact's date of Birth
          example: "2020-05-14"
        nationality:
          type: string
          nullable: true
          maxLength: 64
          description: The ISO country code
          example: AT
        language:
          type: string
          maxLength: 10
          nullable: true
          description: the spoken/preferred/default language of the contact
        gender:
          $ref:  "#/components/schemas/Gender"
        legalIdentificationNumber:
          type: string
          maxLength: 64
          nullable: true
          description: Lets you enter the serial number of the customer’s ID document.
          example: 50670009H68JD220WV28
    Address:
      type: object
      required:
        - zipcode
        - city
      properties:
        lineOne:
          type: string
          maxLength: 64
          nullable: true
          example: "Unit 1"
          description: the first line of the address.
        lineTwo:
          type: string
          maxLength: 64
          nullable: true
          example: "1 Skidata Way"
          description: the second line of the address
        lineThree:
          type: string
          maxLength: 64
          nullable: true
          example: ""
          description: the third line of the address
        lineFour:
          type: string
          maxLength: 64
          nullable: true
          example: "Door 1"
          description: the fourth line of the address
        zipcode:
          type: string
          maxLength: 16
          example: "1117 ZL"
          description: the ZIP code of the city. If not set will default to the same as the facility when in Parking
        city:
          type: string
          maxLength: 64
          example: "Salzburg"
          description: the city name. If not set will default to the same as the facility when in Parking
        region:
          type: string
          maxLength: 25
          nullable: true
          example: "DACH"
          description: the region name
        country:
          type: string
          maxLength: 2
          nullable: true
          example: "AT"
          description: the country code as ISO code

    Communication:
      type: object
      required:
        - marketing
        - thirdParties
        - mailing
      properties:
        marketing:
          type: boolean
          example: true
          description: flag indicating if the contact accepts the usage of their personal data. Mapped to AcceptUsageOfPersonalData
        thirdParties:
          type: boolean
          example: true
          description: flag indicating if the contact accepts the submission of their personal data to 3rd parties
        mailing:
          type: boolean
          example: true
          description: the flag indicating if mailing contact is accepted

    Photo:
      type: object
      required:
        - data
      properties:
        data:
          type: string
          description: The raw base64 encoded string of the image of the user
          example: "SGVsbG8gV29ybGQh"
        expiration:
          type: string
          format: date
          nullable: true
          description: date of the contact's image expiration, to be provided as localdate defined by RFC 3339, section 5.6, for example, '2020-05-01'
          example: "2020-05-01"

    Department:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          description: Lets you enter the name of the contact’s business department. Will either create a new group if name doesn't exist or associate the contact with a new group
          maxLength: 64
        description:
          type: string
          nullable: true
          description: Lets you enter a description of the contact’s business department.
          maxLength: 256

    UserParkingContract:
      type: object
      properties:
        checkLP:
          type: boolean
          description: The license plate is verified in combination with the card data at entrance and exit gates.
        passageLP:
          type: boolean
          description: Entry and exit permissions are verified exclusively via the vehicle license plate.
        spaceNo:
          type: string
          description: The space which is allocated to the user.
          maxLength: 5
        sendElectronicReceipt:
          type: boolean
          description: If true, the receipt will be e-mailed to the customer
        matchEntryPlate:
          type: boolean
          description: Contract parkers who have multiple license plates registered on the system may only exit with the same license plate that was scanned upon entry.
        countUser:
          type: boolean
          description: Include the user in group counts
        remarks:
          $ref:  "#/components/schemas/Remarks"
        overtimeCustomerCreditCardSetting:
          $ref:  "#/components/schemas/OvertimeCustomerCreditCardSetting"

    Remarks:
      type: object
      required:
        - remark1
      properties:
        remark1:
          type: string
          maxLength: 50
          example: "Important Customer"
          description: First remark to store next to user or customer parking contract for helpdesk support.
        remark2:
          type: string
          maxLength: 50
          nullable: true
          example: null
          description: Second remark to store next to  user or customer parking contract for helpdesk support.
        remark3:
          type: string
          maxLength: 50
          nullable: true
          example: null
          description: Third remark to store next to  user or customer parking contract for helpdesk support.

    Gender:
      type: string
      nullable: true
      description: what is the contacts gender
      enum:
        - MALE
        - FEMALE

    ContactType:
      type: string
      nullable: true
      description: what is the contacts type
      enum:
        - GROUP
        - B2B

    User:
      allOf:
        - $ref: "#/components/schemas/Contact"
        - type: object
          properties:
            #UI Mapped
            groupCustomerId:
              type: string
              format: uuid
              nullable: true
            b2bCustomerId:
              type: string
              format: uuid
              nullable: true
            licensePlates:
              type: array
              items:
                $ref: "#/components/schemas/LicensePlate"
            identifications:
              type: array
              items:
                $ref: "#/components/schemas/Identification"
            #UI Mapped ends
            #Hostcomm Mapped
            parkingContract:
              $ref:  "#/components/schemas/UserParkingContract"
            #Hostcomm Mapped ends

    LicensePlate:
      type: object
      required:
        - country
        - value
      properties:
        country:
          type: string
          maxLength: 2
          description: This field contains the ISO 3166 Alpha-2 (https://www.iban.com/country-codes) character country code
          example: DE
        state:
          type: string
          maxLength: 32
          nullable: true
          description: The state within the country
        value:
          type: string
          maxLength: 32
          description: LicensePlate number
          example: HA 123 AB
        vehicle:
          type: string
          maxLength: 64
          nullable: true
          description: The vehicle description

    Identification:
      type: object
      required:
        - type
        - subType
        - value
      properties:
        type:
          type: string
          maxLength: 256
          description: This field must map to one of the GenericIdentification.type configured for the product, e.g. 'LP', 'EXT'
          example: EXT
        subType:
          type: string
          maxLength: 256
          description: This field contains (depending on the Identification type) additional specification of the Identification, e.g. the ISO 3166 Alpha-2 (https://www.iban.com/country-codes) charcter country code for the type 'LP', the bar code format '15693' for the type 'EXT'. Provided by SKIDATA to match the configuration of the product references.
          example: AirportCard
        value:
          type: string
          maxLength: 256
          description: This field contains (depending on the Identification type) SKIDATA Identification number, credit card/debit card number, serial number of a key-card, serial number of an electronic purse, license plate, external card system and serial number of an external card system card or bank identification / account number
          example: MyCard 123

    ManageIdentification:
      type: object
      properties:
        primaryId:
          $ref: "#/components/schemas/Identification"
        secondaryIds:
          type: array
          items:
            $ref: "#/components/schemas/Identification"
          minItems: 0
          maxItems: 4

    ParkingCard:
      type: object
      properties:
        validFrom:
          type: string
          format: date
          nullable: true
          description: |
            Standard Parking Card 'validFrom' date.
            If not provided in request, system will use current day as default validFrom date.
            'validFrom' date must not overlap with other existing parking cards of an user.
            To be provided as localtime defined by RFC 3339, section 5.6.
          example: '2020-05-01'
        validTo:
          type: string
          format: date
          nullable: true
          description: |
            Standard Parking Card 'validTo' date.
            If not provided in request, system will use validFrom date and adds validity period value from TODO.
            'validTo' must be after 'validFrom', before or equals 'endDate' of customer and must
            overlap of other existing cards of an user.
            To be provided as localtime defined by RFC 3339, section 5.6.
            Must be before max date in ParkingLogic which is 31.12.2049.
          example: '2020-05-01'
        singleNeutral:
          type: boolean
          description: should the article be granted single neutral access permission.
          example: false
        externalCardId:
          type: string
          nullable: true
          description: External reference to be stored on user to link with integrator system.
          example: ParkingCard-0001
        carParks:
          type: array
          items:
            $ref: "#/components/schemas/CarPark"

    ValueCard:
      type: object
      properties:
        validFrom:
          type: string
          format: date
          nullable: true
          description: |
            Value Card 'validFrom' date.
            If not provided in request, system will use current day as default validFrom date.
            'validFrom' date must not overlap with other existing value cards of an user.
            To be provided as localtime defined by RFC 3339, section 5.6.
          example: '2020-05-01'
        validTo:
          type: string
          format: date
          nullable: true
          description: |
            Value Card 'validTo' date.
            If not provided in request, system will use validFrom date and adds validity period value from TODO.
            'validTo' must be after 'validFrom', before or equals 'endDate' of customer and must
            overlap of other existing value cards of an user.
            To be provided as localtime defined by RFC 3339, section 5.6.
            Must be before max date in ParkingLogic which is 31.12.2049.
          example: '2020-05-01'
        singleNeutral:
          type: boolean
          description: should the article be granted single neutral access permission.
          example: false
        externalCardId:
          type: string
          nullable: true
          description: an external reference user by the creator to map their id.
          example: ValueCard-0001
        carParks:
          type: array
          items:
            $ref: "#/components/schemas/CarPark"

    ManageDoorAccess:
      type: object
      properties:
        primaryId:
          $ref: "#/components/schemas/DoorAccess"
        secondaryIds:
          type: array
          items:
            $ref: "#/components/schemas/DoorAccess"
          minItems: 0
          maxItems: 4

    Suspension:
      type: object
      required:
        - startDate
        - endDate
      properties:
        startDate:
          type: string
          format: date
          description: Date when the suspension starts starts.
          example: "2020-05-01"
        endDate:
          type: string
          format: date
          description: Date when the suspension starts ends.
          example: "2020-05-01"

    CarPark:
      type: object
      required:
        - carParkNumber
        - entryType
      properties:
        carParkNumber:
          type: integer
        entryType:
          $ref: "#/components/schemas/EntryType"

    DoorAccess:
      allOf:
        - $ref: "#/components/schemas/Identification"
        - type: object
          properties:
            doorCode:
              type: string
              maxLength: 6
              nullable: true
              description: A code which can be enetered at a door reader for access.

    EntryType:
      type: string
      enum:
        - ACCESS_NOT_GRANTED
        - ACCESS_GRANTED_WITH_TIMEWINDOW
        - ACCESS_GRANTED_NO_TIMEWINDOW
        - ACCESS_GRANTED_WITH_TIMEWINDOW_CARPARK_FULL

    TransferStatus:
      type: string
      description: |
        Indicates if an action (e.g. create, cancel, ...) has to be or was transferred to the Parking.Logic system or the transfer failed.
      enum:
        - PENDING
        - TRANSFERRED
        - FAILED

    ProductionReason:
      type: string
      description: what is the production reason of the parking card
      enum:
        - NEW_TICKET
        - EXTENDED_TICKET

    OvertimeCustomerCreditCardSetting:
      type: object
      required:
        - creditCardNumber
        - expiryDate
      properties:
        creditCardNumber:
          type: string
          maxLength: 20
          description: Number of customer credit card .
          example: 5201 2815 0512 9736
        expiryDate:
          type: string
          format: date
          description: Expiration date of customer credit card.
          example: "2020-05-01"
