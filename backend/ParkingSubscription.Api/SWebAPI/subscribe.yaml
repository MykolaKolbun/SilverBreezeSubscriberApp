              example: "7c93a680-2809-11eb-91d2-0242ac1b000d"
            parkingCardId:
              type: string
              format: uuid
              description: Standard Parking Card ID. Returned at creation of a Standard Parking Card and to be used by get, update, delete.
            productId:
              type: string
              format: uuid
            productName:
              type: string
              maxLength: 512
              nullable: true
            lastUpdated:
              type: string
              format: date-time
            blockDate:
              type: string
              format: date
              nullable: true
            suspension:
              $ref: "#/components/schemas/Suspension"
            transferStatus:
              $ref: "#/components/schemas/TransferStatus"
            productionReason:
              $ref: "#/components/schemas/ProductionReason"
            anonymized:
              type: boolean
              description: Boolean flag that the parking card was marked as anonymized and overwritten with random values.
              example: false
            canceled:
              type: boolean
              description: Boolean flag that the parking card was canceled.
              example: false

    GetParkingCards:
      type: array
      items:
        $ref: "#/components/schemas/GetParkingCard"

    UpdateParkingCard:
      allOf:
        - $ref: "#/components/schemas/ManageIdentification"
        - $ref: "#/components/schemas/ParkingCard"

    BlockParkingCard:
      type: object
