            application/json:
              schema:
                $ref:  "#/components/schemas/GetCustomer"
        '404':
          description: Customer not found
          content:
            application/text:
              schema:
                type: string
                description: Customer could not be found
        '500':
          description: Failure
          content:
            application/text:
              schema:
                type: string
                description: Error message why anonymize customer failed

  /customer/v1/{customerId}/block:
    post:
      description: Block a customer
      tags:
        - customer
      operationId: blockCustomer
      parameters:
        - in: path
          name: customerId
          schema:
            type: string
            format: uuid
          required: true
