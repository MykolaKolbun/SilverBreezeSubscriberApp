openapi: 3.0.3

info:
  title: sweb(R) Interface Subscribe API
  description: |
    This API allows integrators to manage customers, users and parking cards.
  version: 1.0.0
  contact:
      name: SKIDATA GmbH
      url: https://www.skidata.com/
      email: info@skidata.com
  license:
    name: https://www.skidata.com
    url: https://www.skidata.com

servers:
  - url: https://car.au.skidata.com/bei/DTASales/SubscribeApi
    description: Asia Pacific Production server
  - url: https://webhost.skidata.com/bei/DTASales/SubscribeApi
    description: EU Production server
  - url: https://hb.usa.skidata.com/bei/DTASales/SubscribeApi
    description: US Production server
  - url: https://sweb.skidata.com/bei/DTASales/SubscribeApi
    description: Staging server
  - url: http://localhost:8080/bei/DTASales/SubscribeApi
    description: Local deployment server

tags:
    - name: monitoring
    - name: customer
    - name: user
    - name: parking card
    - name: value card

security:
  - basicAuth: []

paths:
  /health:
    get:
      description: Health monitoring endpoint
      tags:
        - monitoring
      operationId: health
      responses:
        '200':
          description: Healthy
          content:
            application/text:
              schema:
                type: string
                description: status
                example: UP
        '500':
          description: Failure
          content:
            application/text:
              schema:
                type: string
                description: error message

  /customer/v1:
    post:
      description: Creates a customer
      tags:
        - customer
      operationId: createCustomer
      parameters:
        - in: header
          name: Idempotency-Key
          schema:
            type: string
            format: uuid
          required: false
          example: "7da7a728-f910-11e6-942a-68f728c1ba70"
          description: |
            The idempotency key is a free identifier created by the client to
            identify a request. It is used by the service to identify subsequent
            retries of the same request and ensure idempotent behavior by sending
            the same response without executing the request a second time.

            Clients should be careful as any subsequent requests with the same key
            may return the same response without further check. Therefore, it is
            recommended to use an UUID version 4 (random) or any other random
            string with enough entropy to avoid collisions.

            Idempotency keys never expire. Clients are responsible to create proper keys,
            if they require idempotent behavior.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref:  "#/components/schemas/CreateCustomer"
      responses:
        '201':
          description: A customer object
          content:
            application/json:
              schema:
                $ref:  "#/components/schemas/GetCustomer"
        '500':
          description: Failure
          content:
            application/text:
              schema:
                type: string
                description: error message

  /customer/v1/search:
    get:
      description: Returns a paged list of customers for searches
      tags:
        - customer
      operationId: searchCustomers
      parameters:
        - in: query
          name: externalContactId
          schema:
            type: string
            maxLength: 32
          required: false
          description: Optional externalContactId to search for customer
        - in: query
          name: searchTerm
          schema:
            type: string
            maxLength: 64
          required: false
          description: Search parameter for customer firstname, surname or email
      responses:
        '200':
          description: Customer objects
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetCustomers"
        '500':
          description: Failure
          content:
            application/text:
              schema:
                type: string
                description: error message

  /customer/v1/changes:
    get:
      description: Returns a paged list of customers for data extraction
      tags:
        - customer
      operationId: fetchChangedCustomers
      parameters:
        - in: query
          name: pagingToken
          schema:
            type: string
          required: false
          description: Optional pagingToken to fetch next page of changed customers. The previous response contains this token.
      responses:
        '200':
          description: Changed Customer objects
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetPagedCustomers"
        '500':
          description: Failure
          content:
            application/text:
              schema:
                type: string
                description: error message

  /customer/v1/{customerId}:
    get:
      description: Get a customer
      tags:
        - customer
      operationId: getCustomer
      parameters:
        - in: path
          name: customerId
          schema:
            type: string
            format: uuid
          required: true
          description: UUID of the customer to fetch
          example: "7c93a680-2809-11eb-91d2-0242ac1b000d"
      responses:
        '200':
          description: A customer object
          content:
            application/json:
              schema:
                $ref:  "#/components/schemas/GetCustomer"
        '404':
          description: Customer not found
          content:
            application/text:
              schema:
                type: string
                description: Customer could not be found
        '500':
          description: Failure
          content:
            application/text:
              schema:
                type: string
                description: Error message why customer could not be fetched

    put:
      description: Update a customer
      tags:
        - customer
      operationId: updateCustomer
      parameters:
        - in: path
          name: customerId
          schema:
            type: string
            format: uuid
          required: true
          description: UUID of customer to update
          example: "7c93a680-2809-11eb-91d2-0242ac1b000d"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref:  "#/components/schemas/UpdateCustomer"
      responses:
        '200':
          description: A customer object
          content:
            application/json:
              schema:
                $ref:  "#/components/schemas/GetCustomer"
        '500':
          description: Failure
          content:
            application/text:
              schema:
                type: string
                description: Error message why customer update failed

    delete:
      description: Delete a customer
      tags:
        - customer
      operationId: deleteCustomer
      parameters:
        - in: path
          name: customerId
          schema:
            type: string
            format: uuid
          required: true
          description: UUID of customer to delete
          example: "7c93a680-2809-11eb-91d2-0242ac1b000d"
      responses:
        '204':
          description: Successfully deleted
        '500':
          description: Failure
          content:
            application/text:
              schema:
                type: string
                description: Error message why customer deletion failed

  /customer/v1/{customerId}/user:
    get:
      description: Returns a paged list of users of a customer
      tags:
        - customer
      operationId: getUsersOfCustomer
      parameters:
        - in: path
          name: customerId
          schema:
            type: string
            format: uuid
          required: true
          description: UUID of the customer to fetch a paged list of users
          example: "7c93a680-2809-11eb-91d2-0242ac1b000d"
        - in: query
          name: pagingToken
          schema:
            type: string
          required: false
          description: |
            Optional pagingToken to fetch the next page of users
      responses:
        '200':
          description: A paged list of users of a customer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetPagedUsers"
        '404':
          description: Customer not found
          content:
            application/text:
              schema:
                type: string
                description: Customer could not be found
        '500':
          description: Failure
          content:
            application/text:
              schema:
                type: string
                description: Error message why customer could not be fetched

  /customer/v1/{customerId}/anonymize:
