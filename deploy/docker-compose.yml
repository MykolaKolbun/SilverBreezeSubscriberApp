# ParkingSubscription — Raspberry Pi (ARM64) deployment stack.
# Services: PostgreSQL 16 + API + Nginx APK/static share.
# (No RabbitMQ — the app uses in-process background workers; no admin UI yet.)
#
# Copy this file + .env + init.sql + nginx-apk.conf to the Pi (~/SilverBreezeSubscriberApp)
# and run:  docker compose up -d
# Host ports are chosen to not collide with the EVCharging stack on the same Pi:
#   API 8085, APK share 8086. Postgres is NOT published (internal network only).

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    # No published port — the API reaches Postgres over the internal Docker
    # network (Host=postgres:5432). Avoids clashing with EVCharging's DB on the
    # host and keeps the database off the host network. For an external DB tool,
    # use: docker compose exec postgres psql -U parking -d SWeb_DB
    environment:
      POSTGRES_DB: ${DB_NAME:-SWeb_DB}
      POSTGRES_USER: ${DB_USER:-parking}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-parking} -d ${DB_NAME:-SWeb_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    image: ${API_IMAGE:-ghcr.io/mykolakolbun/parkingsubscription-api:latest}
    restart: unless-stopped
    # 8085 — EVCharging already uses 8081-8084 on this Pi.
    ports:
      - "8085:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Database__Provider: Postgres
      ConnectionStrings__Default: "Host=postgres;Port=5432;Database=${DB_NAME:-SWeb_DB};Username=${DB_USER:-parking};Password=${DB_PASSWORD}"
      Jwt__SigningKey: ${JWT_SIGNING_KEY}
      # TEST PHASE: email is stubbed, so registration returns the confirmation
      # token in the response and the app auto-confirms. Set to "false" once a
      # real email provider is wired in.
      Auth__ExposeDevTokens: "true"
      # iPay gateway. Provider=iPay and the sandbox BaseUrl come from
      # appsettings.Production.json; the merchant id + secret SignKey are injected
      # here from .env (never committed). SignKey is encrypted at rest on first boot.
      Payment__iPay__MchId: ${IPAY_MCH_ID}
      Payment__iPay__SignKey: ${IPAY_SIGN_KEY}
      Payment__iPay__BaseUrl: ${IPAY_BASE_URL:-https://sandbox-checkout.ipay.ua/api302}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      # Data Protection keys that encrypt the iPay SignKey — persisted so restarts
      # can still decrypt what is stored in the database.
      - dataprotection_keys:/keys
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Static file server for sharing the mobile APK (and any other static downloads).
  # Drop app-release.apk into ./apk on the Pi → downloadable at http://<pi>:8086/app-release.apk
  # 8086 — EVCharging already uses 8084 for its own APK download service.
  apk-share:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "8086:80"
    volumes:
      - ./apk:/usr/share/nginx/html:ro
      - ./nginx-apk.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  postgres_data:
  dataprotection_keys:
