# ParkingSubscription — Raspberry Pi (ARM64) deployment stack.
# Services: PostgreSQL 16 + API + Nginx APK/static share.
# (No RabbitMQ — the app uses in-process background workers; no admin UI yet.)
#
# Copy this file + .env + init.sql + nginx-apk.conf to the Pi (e.g. ~/projects/subscribeapp)
# and run:  docker compose up -d

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: ${DB_NAME:-parking}
      POSTGRES_USER: ${DB_USER:-parking}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-parking} -d ${DB_NAME:-parking}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    image: ${API_IMAGE:-ghcr.io/mykolakolbun/parkingsubscription-api:latest}
    restart: unless-stopped
    ports:
      - "8081:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Database__Provider: Postgres
      ConnectionStrings__Default: "Host=postgres;Port=5432;Database=${DB_NAME:-parking};Username=${DB_USER:-parking};Password=${DB_PASSWORD}"
      Jwt__SigningKey: ${JWT_SIGNING_KEY}
      Auth__ExposeDevTokens: "false"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Static file server for sharing the mobile APK (and any other static downloads).
  # Drop app-release.apk into ./apk on the Pi → downloadable at http://<pi>:8084/app-release.apk
  apk-share:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "8084:80"
    volumes:
      - ./apk:/usr/share/nginx/html:ro
      - ./nginx-apk.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  postgres_data:
