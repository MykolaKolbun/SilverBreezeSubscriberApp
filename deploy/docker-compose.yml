# ParkingSubscription — Raspberry Pi (ARM64) deployment stack.
# Services: API + AdminPanel + public Web client + Nginx APK/static share.
#
# PostgreSQL is NOT part of this stack: the app shares the EVCharging PostgreSQL
# instance (container "db" / evchargingapi-db-1) on the external Docker network
# "evchargingapi_default". The SilverBreeze database (SWeb_DB) + role (parking)
# are provisioned once inside that instance with deploy/create-db.sql; the API
# creates/updates its tables via EF Core migrations on startup.
#
# Copy this file + .env + nginx-apk.conf to the Pi (~/SilverBreezeSubscriberApp)
# and run:  docker compose up -d
# Host ports avoid the EVCharging stack on the same Pi:  API 8085, APK 8086, admin 8087, web 8088.

services:
  api:
    image: ${API_IMAGE:-ghcr.io/mykolakolbun/parkingsubscription-api:latest}
    restart: unless-stopped
    # 8085 — EVCharging already uses 8081-8084 on this Pi.
    ports:
      - "8085:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Database__Provider: Postgres
      # Shared EVCharging PostgreSQL, reached by its network alias "db" over the
      # external evchargingapi_default network. SWeb_DB/parking are provisioned by
      # deploy/create-db.sql; the password (parking role) comes from .env DB_PASSWORD.
      ConnectionStrings__Default: "Host=${DB_HOST:-db};Port=5432;Database=${DB_NAME:-SWeb_DB};Username=${DB_USER:-parking};Password=${DB_PASSWORD}"
      Jwt__SigningKey: ${JWT_SIGNING_KEY}
      # TEST PHASE: email is stubbed, so registration returns the confirmation
      # token in the response and the app auto-confirms. Set to "false" once a
      # real email provider is wired in.
      Auth__ExposeDevTokens: "true"
      # Venue-wide cap on concurrently active subscriptions (parking capacity).
      Subscription__MaxActiveSubscriptions: ${MAX_ACTIVE_SUBSCRIPTIONS:-50}
      # iPay, Checkbox and SKIDATA credentials are configured from the AdminPanel
      # (Settings) and stored encrypted in the DB with the shared Data Protection
      # keys — no gateway secrets in env. Providers default to Stub until configured;
      # Provider names (iPay / CheckboxOnline) come from appsettings.Production.json.
    volumes:
      # Data Protection keys that encrypt the iPay SignKey — persisted so restarts
      # can still decrypt what is stored in the database.
      - dataprotection_keys:/keys
    networks:
      - default
      - evcharge
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Admin panel over the same shared database. 8087 — 8081-8086 are taken.
  admin:
    image: ${ADMIN_IMAGE:-ghcr.io/mykolakolbun/parkingsubscription-admin:latest}
    restart: unless-stopped
    ports:
      - "8087:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Database__Provider: Postgres
      ConnectionStrings__Default: "Host=${DB_HOST:-db};Port=5432;Database=${DB_NAME:-SWeb_DB};Username=${DB_USER:-parking};Password=${DB_PASSWORD}"
      Admin__Password: ${ADMIN_PASSWORD:-Passw0rd}
      # Share the API's Data Protection keys so secrets edited here (iPay/Checkbox)
      # are encrypted with the same key the API uses to decrypt them.
      DataProtection__KeysPath: /keys
    volumes:
      - dataprotection_keys:/keys
    networks:
      - default
      - evcharge

  # Public Web client (server-rendered Razor Pages). Talks to the API over the
  # internal Docker network (service "api"), so no CORS and no DB of its own.
  # 8088 — 8081-8087 are taken by EVCharging and the services above.
  web:
    image: ${WEB_IMAGE:-ghcr.io/mykolakolbun/parkingsubscription-web:latest}
    restart: unless-stopped
    ports:
      - "8088:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      # Reach the API by its compose service name on the shared default network.
      Api__BaseUrl: "http://api:8080"
    depends_on:
      - api
    networks:
      - default
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # Static file server for sharing the mobile APK (and any other static downloads).
  # Drop app-release.apk into ./apk on the Pi → downloadable at http://<pi>:8086/app-release.apk
  # 8086 — EVCharging already uses 8084 for its own APK download service.
  apk-share:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "8086:80"
    volumes:
      - ./apk:/usr/share/nginx/html:ro
      - ./nginx-apk.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  dataprotection_keys:

networks:
  default:
  # The EVCharging stack's network, where its PostgreSQL ("db") lives. Must already
  # exist (docker network ls | grep evchargingapi_default). Marked external so this
  # stack joins it rather than creating/owning it.
  evcharge:
    external: true
    name: evchargingapi_default
